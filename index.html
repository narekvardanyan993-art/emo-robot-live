<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EMO AI — Полноэкранный OLED-компаньон с Gemini API</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="relative select-none" style="--emo-color: #00F2FE;">

    <canvas id="emo-canvas" class="fixed inset-0 w-full h-full block z-0 cursor-pointer"></canvas>

    <div id="edge-vignette"></div>
    <div class="oled-matrix-overlay"></div>

    <div id="forehead-zone" class="fixed top-0 left-1/4 right-1/4 h-20 z-10 cursor-pointer flex justify-center items-start pt-2 group">
        <div class="opacity-0 group-hover:opacity-90 transition-opacity text-[10px] font-mono uppercase tracking-widest text-cyan-300 bg-cyan-950/75 px-3 py-1 rounded-full border border-cyan-400/30 pointer-events-none">
            👋 Погладь EMO по лбу
        </div>
    </div>

    <div id="top-hud" class="fixed top-3 left-3 right-3 z-20 flex flex-col items-center gap-2.5 pointer-events-none transition-opacity duration-300">
        <div class="w-full max-w-6xl flex flex-wrap items-center justify-between gap-2">
            <div class="glass-hud px-3.5 py-1.5 rounded-full flex items-center gap-2.5 text-xs font-medium text-zinc-300 pointer-events-auto">
                <span class="w-2.5 h-2.5 rounded-full animate-pulse" style="background: var(--emo-color); box-shadow: 0 0 10px var(--emo-color);"></span>
                <span id="emo-state-label" class="font-mono font-bold tracking-wider text-white">EMO: ЛЮБОПЫТСТВО</span>
                <span class="text-white/20">|</span>
                <span id="ai-status-badge" class="text-[11px] font-mono text-emerald-300 flex items-center gap-1">✨ AI READY</span>
            </div>

            <div class="flex items-center gap-1.5 pointer-events-auto">
                <button id="btn-mic-listen" title="Реакция на внешние звуки и хлопки (Слух ВКЛ/ВЫКЛ)" class="glass-hud px-2.5 py-1.5 rounded-xl text-xs font-mono text-zinc-400 border border-white/10 flex items-center gap-1.5 emo-btn">
                    <span id="mic-listen-icon">🎙️</span>
                    <span id="mic-listen-label" class="hidden sm:inline">Слух ВЫКЛ</span>
                    <span id="mic-level-dot" class="w-1.5 h-1.5 rounded-full bg-zinc-600 transition-transform duration-75"></span>
                </button>

                <button id="btn-voice-modal" title="Тонкая настройка скорости и робо-тембра голоса" class="glass-hud px-2.5 py-1.5 rounded-xl text-xs font-mono text-purple-300 border border-purple-500/30 flex items-center gap-1.5 emo-btn">
                    <span>🎛️</span>
                    <span class="hidden sm:inline">Голос</span>
                </button>

                <button id="btn-tts" title="Голосовая озвучка текста ответа (TTS) ВКЛ/ВЫКЛ" class="glass-hud px-2.5 py-1.5 rounded-xl text-xs font-mono text-emerald-300 border border-emerald-500/30 flex items-center gap-1.5 emo-btn">
                    <span>🗣️</span>
                    <span id="tts-label" class="hidden sm:inline">Речь ВКЛ</span>
                </button>

                <button id="btn-sound" title="Звуковой синтезатор трелей EMO (Web Audio API)" class="glass-hud px-2.5 py-1.5 rounded-xl text-xs font-mono text-emerald-400 flex items-center gap-1.5 emo-btn">
                    <span id="sound-icon">🔊</span>
                    <span id="sound-label" class="hidden sm:inline">Звуки</span>
                </button>

                <button id="btn-api-modal" title="Настройки подключения к ИИ (Gemini API / OpenAI)" class="glass-hud px-3 py-1.5 rounded-xl text-xs font-mono text-cyan-300 border border-cyan-500/30 flex items-center gap-1.5 emo-btn">
                    <span>⚙️</span>
                    <span>API</span>
                </button>

                <button id="btn-dock-toggle" class="glass-hud emo-btn px-2.5 py-1.5 rounded-xl text-xs font-mono text-cyan-300 border border-cyan-500/30 flex items-center gap-1.5" title="Панель эмоций и цветов (Tab)">
                    <span>🎭</span>
                    <span class="hidden sm:inline">Эмоции</span>
                </button>

                <button id="btn-zen" title="Чистый экран (скрыть все панели, оставить только глаза EMO)" class="glass-hud px-2.5 py-1.5 rounded-xl text-xs font-mono text-zinc-200 hover:text-white flex items-center gap-1.5 emo-btn">
                    <svg class="w-4 h-4 text-cyan-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                        <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                    </svg>
                    <span class="hidden md:inline">Чистый экран</span>
                </button>
            </div>
        </div>

        <div id="speech-bubble" class="opacity-0 transform -translate-y-2 transition-all duration-300 glass-hud px-5 py-2.5 rounded-2xl border border-cyan-500/35 text-sm sm:text-base font-medium text-white shadow-2xl text-center max-w-2xl pointer-events-auto">
            <span id="speech-text">Привет! Я EMO. Скажи или напиши мне что угодно — я сам выберу эмоцию!</span>
        </div>
    </div>

    <button id="btn-exit-zen" class="fixed top-3 right-3 z-30 hidden glass-hud px-3 py-1.5 rounded-full text-xs font-mono text-zinc-400 hover:text-white border border-white/10 transition-opacity opacity-35 hover:opacity-100">
        👁️ Показать интерфейс
    </button>

    <!-- Выдвижная Док-панель (Quick Dock) -->
    <div id="quick-dock" class="dock-closed fixed z-30">
        <div class="glass-hud rounded-2xl p-3.5 border border-white/10 shadow-2xl flex flex-col gap-3">
            <!-- Верхняя строка: палитра цветов слева, авто-жизнь и закрытие справа -->
            <div class="flex items-center justify-between gap-2 border-b border-white/10 pb-2.5">
                <div id="color-palette-bar" class="flex items-center gap-2"></div>
                <div class="flex items-center gap-2">
                    <button type="button" id="btn-autolife-toggle" class="px-2.5 py-1 rounded-lg text-[11px] font-mono border transition-all emo-btn bg-cyan-500/20 text-cyan-300 border-cyan-500/40" title="Автоматическое поведение и сон">
                        Авто-жизнь: ВКЛ
                    </button>
                    <button type="button" id="btn-dock-close" class="text-zinc-400 hover:text-white px-2 py-0.5 rounded-lg text-sm hover:bg-white/10 transition-colors" title="Закрыть панель (Tab)">
                        ✕
                    </button>
                </div>
            </div>

            <!-- Средняя строка: категории эмоций -->
            <div id="emotion-category-tabs" class="flex items-center gap-1.5 overflow-x-auto custom-scroll pb-1">
                <button type="button" class="cat-pill active-cat px-3 py-1 rounded-full text-xs font-medium bg-white/10 text-white transition-all hover:bg-white/20 whitespace-nowrap cursor-pointer" data-cat="all">Все 22</button>
                <button type="button" class="cat-pill px-3 py-1 rounded-full text-xs font-medium bg-white/10 text-white transition-all hover:bg-white/20 whitespace-nowrap cursor-pointer" data-cat="basic">Базовые</button>
                <button type="button" class="cat-pill px-3 py-1 rounded-full text-xs font-medium bg-white/10 text-white transition-all hover:bg-white/20 whitespace-nowrap cursor-pointer" data-cat="evil">Эпик / L-01</button>
                <button type="button" class="cat-pill px-3 py-1 rounded-full text-xs font-medium bg-white/10 text-white transition-all hover:bg-white/20 whitespace-nowrap cursor-pointer" data-cat="story">Сюжеты</button>
            </div>

            <!-- Нижняя зона: сетка кнопок 22 эмоций -->
            <div id="emotion-grid" class="grid grid-cols-3 sm:grid-cols-6 md:grid-cols-8 gap-1.5 max-h-40 overflow-y-auto pr-1 custom-scroll"></div>
        </div>
    </div>

    <div id="bottom-hud" class="fixed bottom-5 left-1/2 -translate-x-1/2 z-20 w-[92vw] max-w-2xl transition-all duration-300">
        <div class="glass-hud rounded-full p-1.5 sm:p-2 border border-white/15 shadow-2xl">
            <form id="ai-chat-form" class="flex items-center gap-2">
                <button type="button" id="btn-mic" title="Сказать голосом через микрофон" class="w-10 h-10 rounded-full bg-white/5 hover:bg-white/15 border border-white/10 text-zinc-200 flex items-center justify-center transition-all shrink-0">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"/>
                    </svg>
                </button>
                <input 
                    type="text" 
                    id="ai-input" 
                    autocomplete="off"
                    placeholder="Напиши или попроси EMO (например: «рассмеши меня», «злой смех», «кинь кубик»)..." 
                    class="w-full bg-transparent px-3 py-2 text-xs sm:text-sm text-white placeholder-zinc-400 outline-none"
                >
                <button type="submit" id="btn-send" class="px-5 py-2.5 rounded-full font-bold text-xs sm:text-sm text-black transition-all shrink-0 hover:brightness-110 active:scale-95 flex items-center gap-1.5" style="background: var(--emo-color); box-shadow: 0 0 16px var(--emo-color);">
                    <span>Сказать</span>
                    <span>✨</span>
                </button>
            </form>
        </div>
    </div>

    <div id="voice-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/80 backdrop-filter backdrop-blur-md p-4">
        <div class="glass-hud w-full max-w-md rounded-3xl p-6 border border-purple-500/30 flex flex-col gap-4 shadow-2xl">
            <div class="flex items-center justify-between border-b border-white/10 pb-3">
                <div class="flex items-center gap-2">
                    <span class="text-xl">🎛️</span>
                    <h2 class="text-base font-bold text-white">Настройка Робо-Голоса EMO</h2>
                </div>
                <button type="button" id="btn-close-voice" class="text-zinc-400 hover:text-white text-lg px-2">✕</button>
            </div>
            <div class="flex flex-col gap-3 text-xs">
                <div class="flex flex-col gap-1">
                    <div class="flex justify-between text-zinc-300 font-mono">
                        <span>Скорость речи:</span>
                        <span id="val-voice-rate" class="text-cyan-300 font-bold">0.84x</span>
                    </div>
                    <input type="range" id="slider-voice-rate" min="0.55" max="1.25" step="0.01" value="0.84" class="accent-cyan-400 cursor-pointer">
                </div>
                <div class="flex flex-col gap-1">
                    <div class="flex justify-between text-zinc-300 font-mono">
                        <span>Тембр / Высота голоса (Pitch):</span>
                        <span id="val-voice-pitch" class="text-purple-300 font-bold">0.92</span>
                    </div>
                    <input type="range" id="slider-voice-pitch" min="0.5" max="1.6" step="0.02" value="0.92" class="accent-purple-400 cursor-pointer">
                </div>
                <div class="flex flex-col gap-1">
                    <div class="flex justify-between text-zinc-300 font-mono">
                        <span>Синтез Робо-Вокодера (Web Audio):</span>
                        <span id="val-vocoder-level" class="text-emerald-300 font-bold">65%</span>
                    </div>
                    <input type="range" id="slider-vocoder-level" min="0" max="100" step="5" value="65" class="accent-emerald-400 cursor-pointer">
                </div>
            </div>
            <div class="flex items-center justify-between pt-2 border-t border-white/10">
                <button type="button" id="btn-test-voice" class="px-4 py-2 rounded-xl bg-white/10 hover:bg-white/15 text-xs font-mono text-cyan-300">🔊 Проверить голос</button>
                <button type="button" id="btn-save-voice" class="px-5 py-2 rounded-xl font-bold text-xs text-black" style="background: var(--emo-color);">Готово</button>
            </div>
        </div>
    </div>

    <div id="api-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/80 backdrop-filter backdrop-blur-md p-4">
        <div class="glass-hud w-full max-w-md rounded-3xl p-6 border border-cyan-500/30 flex flex-col gap-4 shadow-2xl">
            <div class="flex items-center justify-between border-b border-white/10 pb-3">
                <div class="flex items-center gap-2">
                    <span class="text-xl">⚙️</span>
                    <h2 class="text-base font-bold text-white">Настройки ИИ-мозга EMO (API)</h2>
                </div>
                <button type="button" id="btn-close-modal" class="text-zinc-400 hover:text-white text-lg px-2">✕</button>
            </div>
            <div class="flex flex-col gap-1.5">
                <label class="text-xs font-mono text-zinc-400">Режим ИИ-мозга:</label>
                <select id="api-provider-select" class="bg-zinc-900/90 border border-white/15 rounded-xl px-3 py-2 text-xs text-white outline-none focus:border-cyan-400">
                    <option value="auto">✨ Автоматический (Gemini API + Безключевой Облачный ИИ)</option>
                    <option value="gemini">Google Gemini API (Личный ключ AIzaSy...)</option>
                    <option value="openai">OpenAI / DeepSeek / Groq (Совместимый URL)</option>
                </select>
            </div>
            <div class="flex flex-col gap-1.5">
                <label class="text-xs font-mono text-zinc-400">API Key:</label>
                <input type="password" id="api-key-input" placeholder="AIzaSy... или sk-..." class="bg-zinc-900/90 border border-white/15 rounded-xl px-3.5 py-2 text-xs text-white font-mono outline-none focus:border-cyan-400">
            </div>
            <div id="openai-extra-fields" class="hidden flex-col gap-3">
                <div class="flex flex-col gap-1">
                    <label class="text-xs font-mono text-zinc-400">Endpoint URL:</label>
                    <input type="text" id="api-endpoint-input" value="https://api.openai.com/v1/chat/completions" class="bg-zinc-900/90 border border-white/15 rounded-xl px-3 py-1.5 text-xs text-white font-mono outline-none focus:border-cyan-400">
                </div>
                <div class="flex flex-col gap-1">
                    <label class="text-xs font-mono text-zinc-400">Модель:</label>
                    <input type="text" id="api-model-input" value="gpt-4o-mini" class="bg-zinc-900/90 border border-white/15 rounded-xl px-3 py-1.5 text-xs text-white font-mono outline-none focus:border-cyan-400">
                </div>
            </div>
            <div class="flex items-center justify-end gap-2 pt-2 border-t border-white/10">
                <button type="button" id="btn-clear-api" class="px-3.5 py-2 rounded-xl bg-white/5 hover:bg-white/10 text-xs text-zinc-300">Сбросить</button>
                <button type="button" id="btn-save-api" class="px-4 py-2 rounded-xl font-bold text-xs text-black" style="background: var(--emo-color);">Сохранить</button>
            </div>
        </div>
    </div>

    <script src="js/config/constants.js"></script>
    <script src="js/audio/soundSynth.js"></script>
    <script src="js/physics/springs.js"></script>
    <script src="js/render/faceRenderer.js"></script>
    <script src="js/ai/aiBrain.js"></script>
    <script src="js/ui/uiController.js"></script>
</body>
</html>
